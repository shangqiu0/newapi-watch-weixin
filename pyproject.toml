[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "newapi-watch"
version = "0.4.0"
description = "Independent NewAPI monitoring and WeCom operations bot"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.1", "httpx==0.28.1", "pydantic-settings==2.16.2",
  "aiosqlite==0.22.1", "matplotlib==3.10.8", "uvicorn==0.54.0",
  "tzdata==2026.6", "wecom-aibot-python-sdk==1.0.2", "cryptography==50.0.2"
]

[project.optional-dependencies]
redis = ["redis==8.1.0"]
dev = ["pytest==9.0.3", "pytest-asyncio==1.3.0", "pytest-cov==7.1.0", "ruff==0.17.4", "mypy==2.4.1", "pip-audit==2.10.1"]

[project.scripts]
newapi-watch = "newapi_watch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
newapi_watch = ["*.sql", "web-dist/*.html", "web-dist/assets/*", "web-dist/*.json", "web-dist/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["artifacts", "output", ".playwright-cli", "frontend", ".venv-console", ".venv-dev"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/newapi_watch"]

[[tool.mypy.overrides]]
module = ["aibot.*", "matplotlib.*", "redis.*"]
ignore_missing_imports = true
