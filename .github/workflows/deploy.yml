name: deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build and deploy (default: current ref)'
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Tag-triggered deploys skip CI (a tag on a tested commit is the release signal);
    # manual dispatch reuses the code already on the tested branch.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || github.ref) || github.ref }}

      - name: Set image tags
        id: tags
        run: |
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/newapi-watch:latest
            ghcr.io/${{ github.repository_owner }}/newapi-watch:${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/newapi-watch
            sudo docker pull ghcr.io/shangqiu0/newapi-watch:latest
            # Redis image: Docker Hub is unreachable from this host; use the Tencent
            # mirror (digest-verified identical) and tag it to the compose-pinned name.
            sudo docker images redis:8.10.2 --format '{{.Repository}}' | grep -q '^redis$' || \
              sudo docker pull mirror.ccs.tencentyun.com/library/redis:8.10.2 && \
              sudo docker tag mirror.ccs.tencentyun.com/library/redis:8.10.2 redis:8.10.2
            sudo docker compose \
              -f compose.yaml -f compose.console.yaml -f compose.image.yaml \
              up -d --no-deps watch
            sudo docker image prune -f
            sleep 8
            curl -fsS http://127.0.0.1:8088/health/live
            echo "DEPLOY_OK image=sha-${GITHUB_SHA::7}"
